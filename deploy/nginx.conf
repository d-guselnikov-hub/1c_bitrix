# /etc/nginx/sites-available/arbitr-1c
# Сертификат: certbot --nginx -d 1c.example.kz
server {
    listen 80;
    server_name 1c.example.kz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 1c.example.kz;

    ssl_certificate     /etc/letsencrypt/live/1c.example.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1c.example.kz/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 1С иногда отвечает долго
        proxy_read_timeout 120s;
    }
}
