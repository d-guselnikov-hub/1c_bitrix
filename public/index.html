<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Счета и дебиторка (1С)</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://api.bitrix24.com/api/v1/"></script>
  <script>/*__BOOT__*/</script>
</head>
<body>
  <header class="top">
    <div class="title">
      <h1>Счета и дебиторка</h1>
      <span class="src" id="src"></span> <span class="muted" id="roleNote"></span>
    </div>
    <div class="controls">
      <div class="presets" id="companies" title="Компания"></div>
      <select id="branchSel" hidden></select>
      <div class="presets" id="presets">
        <button data-p="month" class="on">Этот месяц</button>
        <button data-p="prev">Прошлый месяц</button>
        <button data-p="quarter">Квартал</button>
        <button data-p="year">Год</button>
      </div>
      <input type="date" id="from"> <span class="dash">по</span> <input type="date" id="to">
      <button class="primary" id="refresh" title="Перечитать из 1С">Обновить</button>
      <button id="accessBtn" hidden>Доступ</button>
    </div>
  </header>

  <section class="card" id="accessCard" hidden>
    <div class="card-h"><b>Кто видит отчёт</b><span class="muted">меняют администраторы, изменения действуют сразу</span></div>
    <table id="accessTbl"></table>
    <div class="access-add">
      <button class="primary" id="accessPick">Добавить сотрудника</button>
      <span class="muted" id="accessManual" hidden>
        ID <input id="accId" size="6"> Имя <input id="accName" size="22"> <button id="accAdd">Добавить</button>
      </span>
      <span class="muted" id="accessMsg"></span>
    </div>
  </section>

  <div id="warn" class="warn" hidden></div>
  <div id="err" class="err" hidden></div>

  <section class="kpis" id="kpis"></section>

  <section class="card aging">
    <div class="card-h"><b>Структура долга</b><span class="muted" id="term"></span></div>
    <div class="bar" id="agingBar"></div>
    <div class="legend" id="agingLegend"></div>
  </section>

  <section class="card">
    <div class="tabs" id="tabs">
      <button data-t="clients" class="on">Клиенты</button>
      <button data-t="invoices">Счета</button>
      <button data-t="managers">Менеджеры</button>
      <div class="spacer"></div>
      <label class="chk" id="onlyDebtWrap"><input type="checkbox" id="onlyDebt"> только с долгом</label>
      <input type="search" id="q" placeholder="Поиск: клиент, БИН, номер счёта">
      <button id="csv">CSV</button>
    </div>
    <div class="table-wrap"><table id="tbl"></table></div>
  </section>

  <footer class="foot" id="foot"></footer>
  <div class="loader" id="loader" hidden><div class="spin"></div>Тянем данные из 1С…</div>

  <script src="/static/app.js"></script>
</body>
</html>
